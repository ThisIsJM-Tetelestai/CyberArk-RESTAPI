info:
  name: Get-SafeDetails
  type: http
  seq: 3

http:
  method: GET
  url: https://{{PVWA_Server_address}}/PasswordVault/API/Safes/{{SafeName}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{AuthToken}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // 1. Get the parsed JSON response body
        const responseData = res.getBody();

        // 2. Extract the safeNumber
        const safeIdValue = responseData.safeNumber;

        // 3. Save it to a variable called SafeID
        if (safeIdValue !== undefined) {
          bru.setVar("SafeID", safeIdValue);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
