info:
  name: Add-Account
  type: http
  seq: 4

http:
  method: GET
  url: https://{{PVWA_Server_address}}/PasswordVault/API/Safes/{{SafeName}}
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "{{AuthToken}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
